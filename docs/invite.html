<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<!-- Safari on iPhone shows its own "Open / Get" banner for the app. -->
<meta name="apple-itunes-app" content="app-id=6799301780" />
<title>You're invited — Ping</title>
<!-- Static page (GitHub Pages) - link-preview crawlers (iMessage, RCS,
     etc.) only read this raw HTML, they never run the JS below that fills
     in the specific event, so these tags describe the invite generically
     rather than per-event. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="You're invited! — Ping" />
<meta property="og:description" content="Tap to see the event details and RSVP." />
<meta property="og:image" content="https://pingmobileapp.github.io/Ping/ping-icon.png" />
<meta property="og:url" content="https://pingmobileapp.github.io/Ping/invite.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="You're invited! — Ping" />
<meta name="twitter:description" content="Tap to see the event details and RSVP." />
<meta name="twitter:image" content="https://pingmobileapp.github.io/Ping/ping-icon.png" />
<style>
  html { background: #FFFFFF; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    color: #2B2B2B;
    background: #FFFFFF;
    line-height: 1.6;
    text-align: center;
  }
  .app-bar {
    display: flex; align-items: center; gap: 12px; text-align: left; text-decoration: none; color: #2B2B2B;
    border: 1px solid #E8DCC8; border-radius: 14px; padding: 10px 12px; margin: -24px 0 24px; background: #FFFFFF;
  }
  .app-bar img { width: 44px; height: 44px; border-radius: 10px; flex: 0 0 44px; }
  .app-bar-text { flex: 1; min-width: 0; }
  .app-name { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .app-sub { font-size: 13px; color: #6B6B6B; line-height: 1.3; }
  .app-get { background: #5DADE2; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 7px 16px; border-radius: 999px; }
  h1 { font-size: 26px; margin: 0 0 20px; }
  .card {
    background: #FFF8EC;
    border: 1px solid #E8DCC8;
    border-radius: 16px;
    padding: 24px;
    text-align: left;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .card-image {
    display: block;
    width: calc(100% + 48px);
    margin: -24px -24px 16px;
    max-height: 240px;
    object-fit: cover;
  }
  .row { margin-bottom: 8px; font-size: 15px; }
  .row strong { color: #2B2B2B; }
  .status { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: #AEE1F9; font-size: 13px; font-weight: 600; }
  .hint { color: #6B6B6B; font-size: 14px; margin-bottom: 28px; }
  .button {
    display: inline-block;
    background: #5DADE2;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
  }
  .error { color: #6B6B6B; padding: 40px 0; }
  .steps { text-align: left; margin: 0 0 28px; padding: 0; list-style: none; }
  .steps li { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; font-size: 16px; }
  .steps .num {
    flex: 0 0 28px; height: 28px; border-radius: 14px; background: #5DADE2; color: #FFFFFF;
    font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .steps-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; text-align: left; }
  .small { color: #6B6B6B; font-size: 14px; margin-top: 22px; }
  .rsvp-title { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
  .rsvp-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .rsvp-btn {
    flex: 1; padding: 13px 4px; border-radius: 12px; border: 1px solid #E8DCC8; background: #FFF8EC;
    font-size: 15px; font-weight: 600; color: #2B2B2B; cursor: pointer; font-family: inherit;
  }
  .rsvp-btn.selected { background: #5DADE2; border-color: #5DADE2; color: #FFFFFF; }
  .rsvp-btn:disabled { opacity: 0.6; cursor: default; }
  .rsvp-msg { font-size: 15px; min-height: 22px; margin: 4px 0 8px; }
  .rsvp-msg.error { color: #C0392B; }
  .cal-link { display: inline-block; font-size: 15px; color: #2E86C1; margin-bottom: 8px; }
  .app-pitch { margin-top: 32px; padding-top: 24px; border-top: 1px solid #E8DCC8; }
  .itinerary { margin-top: 16px; padding-top: 14px; border-top: 1px solid #E8DCC8; }
  .itinerary-title { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 10px; }
  .itinerary-day { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .itinerary-stop { border-left: 2px solid #E8DCC8; padding-left: 12px; margin: 0 0 8px; font-size: 15px; }
  .itinerary-stop a { color: #2E86C1; }
  .itinerary-group { margin-bottom: 12px; }
  .row a { color: #2E86C1; text-decoration: none; }
  .note { margin-top: 12px; padding-top: 12px; border-top: 1px solid #E8DCC8; font-size: 15px; white-space: pre-wrap; }
  .going { margin-top: 12px; font-size: 14px; color: #6B6B6B; }
  .bring { text-align: left; margin-top: 28px; }
  .bring-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  .bring-sub { color: #6B6B6B; font-size: 14px; margin: 0 0 14px; text-align: center; }
  .bring-item { border: 1px solid #E8DCC8; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: #FFFFFF; }
  .bring-head { display: flex; align-items: center; gap: 10px; }
  .bring-name { flex: 1; font-size: 16px; font-weight: 600; }
  .bring-meta { color: #6B6B6B; font-size: 13px; font-weight: 400; }
  .bring-btn {
    border: none; border-radius: 10px; background: #5DADE2; color: #FFFFFF; font-weight: 700; font-size: 14px;
    padding: 9px 14px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .bring-btn.quiet { background: #FFF8EC; color: #2B2B2B; border: 1px solid #E8DCC8; }
  .bring-btn:disabled { opacity: 0.6; cursor: default; }
  .bring-entry { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-top: 8px; }
  .bring-entry span { flex: 1; }
  .bring-entry .you { color: #6B6B6B; font-size: 13px; }
  .bring-remove { border: none; background: none; color: #C0392B; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 0; }
  .bring-add { display: flex; gap: 8px; margin-top: 10px; }
  .bring-add input {
    flex: 1; min-width: 0; border: 1px solid #E8DCC8; border-radius: 10px; padding: 10px 12px; font-size: 16px;
    background: #FFF8EC; font-family: inherit; color: #2B2B2B;
  }
  .bring-msg { font-size: 14px; min-height: 20px; text-align: center; }
  .bring-msg.error { color: #C0392B; }
</style>
</head>
<body>
  <a class="app-bar" id="app-bar" href="https://apps.apple.com/app/id6799301780">
    <img src="ping-icon.png" alt="" />
    <div class="app-bar-text">
      <div class="app-name">Ping - Event Planner</div>
      <div class="app-sub" id="app-sub">Free on the App Store</div>
    </div>
    <span class="app-get" id="app-get">Get</span>
  </a>
  <div id="content">
    <p class="error">Loading your invite…</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const inviteeId = params.get('i');
    const content = document.getElementById('content');
    // Flip to true once Ping is live on Google Play - until then an Android
    // visitor gets a "coming soon" note instead of a link to a Play listing
    // that doesn't exist yet.
    const PLAY_STORE_LIVE = false;
    const IS_ANDROID = /android/i.test(navigator.userAgent);
    const IS_APPLE = /iphone|ipad|ipod|macintosh/i.test(navigator.userAgent);
    const APP_STORE_URL = IS_ANDROID
      ? 'https://play.google.com/store/apps/details?id=com.pingmobileapp.ping'
      : 'https://apps.apple.com/app/id6799301780';
    // The bar at the top: the app's store name, tappable to download.
    (function setUpAppBar() {
      const bar = document.getElementById('app-bar');
      const sub = document.getElementById('app-sub');
      const get = document.getElementById('app-get');
      if (IS_ANDROID && !PLAY_STORE_LIVE) {
        bar.removeAttribute('href');
        sub.textContent = 'Android app coming soon';
        get.remove();
      } else {
        bar.href = APP_STORE_URL;
        sub.textContent = IS_ANDROID ? 'Free on Google Play' : 'Free on the App Store';
      }
    })();
    const FUNCTION_URL = 'https://rmooxzkinakbyhvxcivv.supabase.co/functions/v1/invite-info';
    const RSVP_URL = 'https://rmooxzkinakbyhvxcivv.supabase.co/functions/v1/invite-rsvp';
    const BRING_URL = 'https://rmooxzkinakbyhvxcivv.supabase.co/functions/v1/invite-bring';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const dayKey = (d) =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    function mapsUrl(address) {
      const q = encodeURIComponent(address);
      return IS_APPLE ? `https://maps.apple.com/?q=${q}` : `https://maps.google.com/?q=${q}`;
    }

    // Same shape as the app's Itinerary (lib/stops.ts): stops grouped by
    // day, in the order the host added them. Day headings only for a
    // multi-day Ping - a one-day Ping's date is already shown above.
    function itineraryHtml(stops, showDays) {
      if (!stops || stops.length === 0) return '';
      const groups = [];
      for (const stop of stops) {
        const last = groups[groups.length - 1];
        if (last && last.day === stop.day) last.stops.push(stop);
        else groups.push({ day: stop.day, stops: [stop] });
      }
      return `
        <div class="itinerary">
          <div class="itinerary-title">Itinerary</div>
          ${groups.map((g) => {
            const [y, m, d] = g.day.split('-').map(Number);
            const label = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
            return `
              <div class="itinerary-group">
                ${showDays ? `<div class="itinerary-day">${escapeHtml(label)}</div>` : ''}
                ${g.stops.map((s) => `
                  <div class="itinerary-stop">
                    ${s.name ? `<div>${escapeHtml(s.name)}</div>` : ''}
                    ${s.address ? `<a href="${escapeHtml(mapsUrl(s.address))}">${escapeHtml(s.address)}</a>` : ''}
                  </div>`).join('')}
              </div>`;
          }).join('')}
        </div>`;
    }

    function statusLabel(status) {
      if (status === 'accepted') return "You're going";
      if (status === 'declined') return "You declined";
      if (status === 'interested') return "You're interested";
      return null;
    }

    // "Add to calendar" for someone without the app - a one-event .ics file,
    // which iPhone, Android and desktop calendars all open.
    function icsHref(info) {
      const pad = (n) => String(n).padStart(2, '0');
      const utc = (d) =>
        `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
      const day = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
      const esc = (t) => String(t || '').replace(/[\\,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
      const start = new Date(info.eventDate);
      const end = info.endDate ? new Date(info.endDate) : new Date(start.getTime() + 60 * 60000);
      let when;
      if (info.isAllDay) {
        const after = new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1);
        when = [`DTSTART;VALUE=DATE:${day(start)}`, `DTEND;VALUE=DATE:${day(after)}`];
      } else {
        when = [`DTSTART:${utc(start)}`, `DTEND:${utc(end)}`];
      }
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ping//Invite//EN', 'BEGIN:VEVENT',
        `UID:${inviteeId}@pingmobileapp`, `DTSTAMP:${utc(new Date())}`, ...when,
        `SUMMARY:${esc(info.eventTitle)}`,
        ...(info.location ? [`LOCATION:${esc(info.location)}`] : []),
        `DESCRIPTION:${esc('Invited by ' + info.hostName + ' on Ping')}`,
        'END:VEVENT', 'END:VCALENDAR',
      ];
      return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
    }

    // Going / Maybe / Can't go, saved through invite-rsvp. Answering again
    // just changes it.
    function wireRsvp(info) {
      const buttons = Array.from(document.querySelectorAll('.rsvp-btn'));
      const msg = document.getElementById('rsvp-msg');
      const cal = document.getElementById('cal-link');
      const host = info.hostName;
      const thanks = {
        accepted: `You're going! ${host} will see it.`,
        interested: `Marked as maybe. ${host} will see it.`,
        declined: `Got it, you can't make it. ${host} will see it.`,
      };
      const show = (status) => {
        buttons.forEach((b) => b.classList.toggle('selected', b.dataset.status === status));
        if (cal) cal.style.display = status === 'accepted' ? 'inline-block' : 'none';
      };
      show(info.rsvpStatus);
      buttons.forEach((btn) =>
        btn.addEventListener('click', async () => {
          const status = btn.dataset.status;
          buttons.forEach((b) => (b.disabled = true));
          msg.className = 'rsvp-msg';
          msg.textContent = 'Saving…';
          try {
            const res = await fetch(RSVP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ i: inviteeId, status }),
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              const reasons = {
                full: "This event is full. You can still answer Maybe.",
                paid: 'This event has tickets. Get them in the Ping app.',
                past: 'This event has already happened.',
              };
              throw new Error(reasons[body.error] || "Couldn't save that. Check your connection and try again.");
            }
            info.rsvpStatus = body.status;
            show(body.status);
            msg.textContent = thanks[body.status];
            refreshBring();
          } catch (err) {
            msg.className = 'rsvp-msg error';
            msg.textContent = err.message;
          } finally {
            buttons.forEach((b) => (b.disabled = false));
          }
        })
      );
    }

    // What to bring, the same two kinds as the app: specific items ("Chips,
    // 2 needed" - tap to take one) and the open list, where each guest adds
    // what they're bringing. Shows what's coming, never who's bringing it.
    function bringHtml(info) {
      if (!info.items || info.items.length === 0) return '';
      const declined = info.rsvpStatus === 'declined';
      const canEdit = !info.isPast && !declined;
      const rows = info.items.map((item) => {
        if (item.allowCustom) {
          const entries = item.entries.map((e) => `
            <div class="bring-entry">
              <span>• ${escapeHtml(e.note)}${e.mine ? ' <span class="you">(you)</span>' : ''}</span>
              ${e.mine && !info.isPast ? `<button class="bring-remove" data-act="remove" data-claim="${e.id}">Remove</button>` : ''}
            </div>`).join('');
          const mineCount = item.entries.filter((e) => e.mine).length;
          return `
            <div class="bring-item">
              <div class="bring-name">${escapeHtml(item.name)}
                <div class="bring-meta">${item.entries.length === 0 ? 'Nothing yet. Be the first!' : 'Add as many things as you like'}</div>
              </div>
              ${entries}
              ${canEdit ? `
                <form class="bring-add" data-item="${item.id}">
                  <input name="note" maxlength="80" placeholder="${mineCount ? 'Add something else' : 'e.g. Mac and cheese'}" autocomplete="off" />
                  <button class="bring-btn" type="submit">Add</button>
                </form>` : ''}
            </div>`;
        }
        const left = Math.max(0, item.needed - item.covered);
        const meta = item.mine > 0
          ? (item.needed > 1 ? `You're bringing ${item.mine} · ${item.covered} of ${item.needed} covered` : "You're bringing this")
          : left === 0 ? 'Covered' : item.needed > 1 ? `${left} of ${item.needed} still needed` : 'Still needed';
        let button = '';
        if (canEdit && left > 0) {
          button = `<button class="bring-btn" data-act="claim" data-item="${item.id}">${item.mine > 0 ? 'Bring 1 more' : "I'll bring it"}</button>`;
        }
        if (!info.isPast && item.mine > 0) {
          button += ` <button class="bring-btn quiet" data-act="unclaim" data-item="${item.id}">Undo</button>`;
        }
        return `
          <div class="bring-item">
            <div class="bring-head">
              <div class="bring-name">${escapeHtml(item.name)}<div class="bring-meta">${meta}</div></div>
              ${button}
            </div>
          </div>`;
      }).join('');
      return `
        <p class="bring-title">What to bring</p>
        <p class="bring-sub">${declined ? "You said you can't make it, so there's nothing to bring." : `${escapeHtml(info.hostName)} would love some help.`}</p>
        ${rows}
        <p class="bring-msg" id="bring-msg"></p>`;
    }

    async function fetchInfo() {
      const res = await fetch(`${FUNCTION_URL}?i=${encodeURIComponent(inviteeId)}`);
      if (!res.ok) throw new Error('not found');
      return res.json();
    }

    // Redraws only the What to bring section, so the RSVP buttons and
    // anything typed elsewhere stay put.
    async function refreshBring(message, isError) {
      const box = document.getElementById('bring');
      if (!box) return;
      try {
        const info = await fetchInfo();
        box.innerHTML = bringHtml(info);
      } catch (_) { /* keep what's on screen */ }
      const msg = document.getElementById('bring-msg');
      if (msg && message) {
        msg.className = 'bring-msg' + (isError ? ' error' : '');
        msg.textContent = message;
      }
    }

    async function bringAction(payload) {
      const msg = document.getElementById('bring-msg');
      if (msg) { msg.className = 'bring-msg'; msg.textContent = 'Saving…'; }
      const res = await fetch(BRING_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ i: inviteeId, ...payload }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) return null;
      const reasons = {
        full: 'Someone just took the last one.',
        duplicate: "You've already added that.",
        declined: "You said you can't make it. Change your answer above to bring something.",
        past: 'This event has already happened.',
      };
      return reasons[body.error] || "Couldn't save that. Check your connection and try again.";
    }

    function wireBring() {
      const box = document.getElementById('bring');
      if (!box) return;
      box.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        btn.disabled = true;
        const act = btn.dataset.act;
        const err = await bringAction(act === 'remove' ? { action: act, claimId: btn.dataset.claim } : { action: act, itemId: btn.dataset.item });
        await refreshBring(err || (act === 'claim' ? 'Thanks! The host will see it.' : ''), !!err);
      });
      box.addEventListener('submit', async (e) => {
        const form = e.target.closest('form.bring-add');
        if (!form) return;
        e.preventDefault();
        const input = form.querySelector('input');
        const note = input.value.trim();
        if (!note) return;
        form.querySelector('button').disabled = true;
        const err = await bringAction({ action: 'add', itemId: form.dataset.item, note });
        await refreshBring(err || 'Added! The host will see it.', !!err);
      });
    }

    if (!inviteeId) {
      content.innerHTML = '<p class="error">This invite link looks incomplete.</p>';
    } else {
      fetchInfo()
        .then((info) => {
          const date = new Date(info.eventDate);
          const end = info.endDate ? new Date(info.endDate) : null;
          const isMultiDay = !!end && dayKey(end) !== dayKey(date);
          const dateLabel = isMultiDay
            ? `${date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })} – ${end.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}`
            : date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
          const whenLabel = info.isAllDay
            ? dateLabel
            : `${dateLabel} · ${date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}`;
          const host = escapeHtml(info.hostName);
          const goingLine = [
            info.goingCount ? `${info.goingCount} going` : '',
            info.maybeCount ? `${info.maybeCount} maybe` : '',
          ].filter(Boolean).join(' · ');
          // Paid events are bought in the app, so the page only offers
          // Maybe / Can't go there; past events can't be answered at all.
          const canGo = !info.isPaid && !info.isFull;
          const rsvpBlock = info.isPast
            ? `<p class="hint">This event has already happened.</p>`
            : `
              <p class="rsvp-title">Can you make it?</p>
              <div class="rsvp-row">
                ${canGo ? '<button class="rsvp-btn" data-status="accepted">Going</button>' : ''}
                <button class="rsvp-btn" data-status="interested">Maybe</button>
                <button class="rsvp-btn" data-status="declined">Can't go</button>
              </div>
              <p class="rsvp-msg" id="rsvp-msg">${
                info.isPaid ? 'This event has tickets. Get them in the Ping app.' :
                info.isFull ? 'This event is full. You can still answer Maybe.' :
                info.rsvpStatus && info.rsvpStatus !== 'pending' ? escapeHtml(statusLabel(info.rsvpStatus)) + '. You can change it anytime.' : ''
              }</p>
              <a class="cal-link" id="cal-link" style="display:none" href="${icsHref(info)}" download="ping-invite.ics">📅 Add to my calendar</a>`;

          content.innerHTML = `
            <h1>${escapeHtml(info.hostName)} invited you</h1>
            <div class="card">
              ${info.imageUrl ? `<img class="card-image" src="${escapeHtml(info.imageUrl)}" alt="" />` : ''}
              <div class="row"><strong>${escapeHtml(info.eventTitle)}</strong></div>
              <div class="row">${escapeHtml(whenLabel)}</div>
              ${info.location ? `<div class="row"><a href="${escapeHtml(mapsUrl(info.location))}">📍 ${escapeHtml(info.location)}</a></div>` : ''}
              ${goingLine ? `<div class="going">${goingLine}</div>` : ''}
              ${info.description ? `<div class="note">${escapeHtml(info.description)}</div>` : ''}
              ${itineraryHtml(info.stops, isMultiDay)}
            </div>
            ${rsvpBlock}
            <div class="bring" id="bring">${bringHtml(info)}</div>
            <div class="app-pitch">
              <p class="steps-title">Want reminders and the group chat?</p>
              <ol class="steps">
                <li><span class="num">1</span><span>Get the free Ping app.</span></li>
                <li><span class="num">2</span><span>Sign up with <strong>this phone number</strong>, the one ${host} texted.</span></li>
                <li><span class="num">3</span><span>This invite and your answer will already be there.</span></li>
              </ol>
              ${IS_ANDROID && !PLAY_STORE_LIVE
                ? '<p class="hint">Ping for Android is coming soon. Your answer above still reaches ' + host + '.</p>'
                : `<a class="button" href="${APP_STORE_URL}">Get the Ping App</a>`}
              <p class="small">Already have Ping? Open the app and check that your phone number is saved in Settings.</p>
            </div>
          `;
          if (!info.isPast) wireRsvp(info);
          wireBring();
        })
        .catch(() => {
          content.innerHTML = '<p class="error">This invite couldn\'t be found. It may have been canceled.</p>';
        });
    }
  </script>
</body>
</html>
