<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're invited — Ping</title>
<!-- Static page (GitHub Pages) - link-preview crawlers (iMessage, RCS,
     etc.) only read this raw HTML, they never run the JS below that fills
     in the specific event, so these tags describe the invite generically
     rather than per-event. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="You're invited! — Ping" />
<meta property="og:description" content="Tap to see the event details and RSVP." />
<meta property="og:image" content="https://pingmobileapp.github.io/Ping/ping-icon.png" />
<meta property="og:url" content="https://pingmobileapp.github.io/Ping/invite.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="You're invited! — Ping" />
<meta name="twitter:description" content="Tap to see the event details and RSVP." />
<meta name="twitter:image" content="https://pingmobileapp.github.io/Ping/ping-icon.png" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 20px 80px;
    color: #2B2B2B;
    line-height: 1.6;
    text-align: center;
  }
  .eyebrow { color: #6B6B6B; font-size: 14px; margin-bottom: 4px; }
  h1 { font-size: 26px; margin: 0 0 20px; }
  .card {
    background: #FFF8EC;
    border: 1px solid #E8DCC8;
    border-radius: 16px;
    padding: 24px;
    text-align: left;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .card-image {
    display: block;
    width: calc(100% + 48px);
    margin: -24px -24px 16px;
    max-height: 240px;
    object-fit: cover;
  }
  .row { margin-bottom: 8px; font-size: 15px; }
  .row strong { color: #2B2B2B; }
  .status { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: #AEE1F9; font-size: 13px; font-weight: 600; }
  .hint { color: #6B6B6B; font-size: 14px; margin-bottom: 28px; }
  .button {
    display: inline-block;
    background: #5DADE2;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 15px;
  }
  .error { color: #6B6B6B; padding: 40px 0; }
</style>
</head>
<body>
  <div class="eyebrow">Ping</div>
  <div id="content">
    <p class="error">Loading your invite…</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const inviteeId = params.get('i');
    const content = document.getElementById('content');
    const APP_STORE_URL = 'https://apps.apple.com/app/id6799301780';
    const FUNCTION_URL = 'https://rmooxzkinakbyhvxcivv.supabase.co/functions/v1/invite-info';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function statusLabel(status) {
      if (status === 'accepted') return "You're going";
      if (status === 'declined') return "You declined";
      if (status === 'interested') return "You're interested";
      return null;
    }

    if (!inviteeId) {
      content.innerHTML = '<p class="error">This invite link looks incomplete.</p>';
    } else {
      fetch(`${FUNCTION_URL}?i=${encodeURIComponent(inviteeId)}`)
        .then((res) => {
          if (!res.ok) throw new Error('not found');
          return res.json();
        })
        .then((info) => {
          const date = new Date(info.eventDate);
          const dateLabel = date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
          const timeLabel = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
          const label = statusLabel(info.rsvpStatus);

          content.innerHTML = `
            <h1>${escapeHtml(info.hostName)} invited you</h1>
            <div class="card">
              ${info.imageUrl ? `<img class="card-image" src="${escapeHtml(info.imageUrl)}" alt="" />` : ''}
              <div class="row"><strong>${escapeHtml(info.eventTitle)}</strong></div>
              <div class="row">${escapeHtml(dateLabel)} · ${escapeHtml(timeLabel)}</div>
              ${info.location ? `<div class="row">${escapeHtml(info.location)}</div>` : ''}
              ${label ? `<div class="status">${label}</div>` : ''}
            </div>
            <p class="hint">Reply to the text you received to RSVP, or get the app to see full details and chat with the group.</p>
            <a class="button" href="${APP_STORE_URL}">Get the Ping App</a>
          `;
        })
        .catch(() => {
          content.innerHTML = '<p class="error">This invite couldn\'t be found. It may have been canceled.</p>';
        });
    }
  </script>
</body>
</html>
